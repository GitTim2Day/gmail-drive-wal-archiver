name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip

      - run: pip install -r requirements.txt

      - run: python -m compileall gmail_wal_archiver.py test_gmail_wal_archiver.py

      - run: python -m unittest test_gmail_wal_archiver.py -v
